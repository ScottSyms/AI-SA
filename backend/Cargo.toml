[package]
name = "tommy3-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tommy3-backend"
path = "src/main.rs"

[[bin]]
name = "seed-data"
path = "src/bin/seed_data.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
duckdb = { version = "1.2", features = ["bundled"] }
dotenvy = "0.15"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
